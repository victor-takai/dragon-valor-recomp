# Dragon Valor (USA) cheats. One feature, on by default with every option off:
# that keeps the plugin (mods/plugins/dragonvalor_cheats.c) in the session's
# plan, so the in-game menu (Escape / Select+Start) can switch each cheat on
# and off at once, and the launcher's Mods page sets the same options before
# a start. Each option is a GameShark-style "every frame" write. One-shot
# edits (Val, max HP/MP, STR, DEF, spell levels, items) live in the in-game
# menu's Cheats / Magic / Items pages, not here.
# RAM addresses: docs/DEVELOPMENT.md, "Known RAM addresses".
format_version = 7
id = "dragonvalor.cheats"
version = "1.2.0"
name = "Dragon Valor Cheats"
author = "DragonValorUSRecomp"
description = "Infinite HP and infinite MP for the USA release, switchable in-game (the in-game menu also edits Val, stats, spells and items). Both off until you turn them on."
license = "MIT"
resolver = "declarative"
# Cheats change RAM only; saves stay interchangeable with a stock session.
save_compatibility = "shared"

[[target]]
game_id = "SLUS-01092"

[[feature]]
id = "cheats"
name = "Cheats"
description = "Holds the cheat switches. Enabled by default so they can be changed in-game; with every option off it does nothing."
group = "Cheats"
default_enabled = true

[[option]]
feature = "cheats"
id = "infinite_hp"
label = "Infinite HP"
description = "Refills HP to its maximum every frame while a hero is loaded. A hit still shows, but the bar never reaches zero."
type = "boolean"
default = "false"

[[option]]
feature = "cheats"
id = "infinite_mp"
label = "Infinite MP"
description = "Refills MP to its maximum every frame while a hero is loaded, so magic is free."
type = "boolean"
default = "false"

[[plugin]]
feature = "cheats"
id = "dragonvalor.cheats"
