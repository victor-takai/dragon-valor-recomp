# Title override of the framework's psx.presentation.bezel (same id and version, so it
# shadows the builtin in mods/bundled), for the launcher's Mods page only:
# a name and a description a player understands (the first sentence is the
# list row's summary) and this title's groups, Game / Graphics
# (2026-11-18, the player found the page cryptic). Everything else is the
# builtin manifest verbatim (psxrecomp/mods/builtin/packages).
format_version = 5
id = "psx.presentation.bezel"
version = "1.0.0"
name = "Bezel Artwork"
author = "psxrecomp"
description = "Draws user-selected artwork behind the game image in OpenGL letterbox or pillarbox margins. Disabled by default; with the feature off, margins remain the normal black clear."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "*"

[[feature]]
id = "bezel"
name = "Bezel artwork"
description = "Art in the black bars. Shows an image of your choice behind the game whenever the picture leaves bars at the sides or top (4:3 on a wide screen; with Widescreen on there are none). Presentation only, OpenGL."
group = "Graphics"
default_enabled = false

[[resource]]
feature = "bezel"
id = "artwork"
label = "Bezel image"
description = "Select an image to draw behind the game frame in letterbox or pillarbox margins."
format = "file"
file_patterns = "*.png,*.jpg,*.jpeg,*.bmp"
file_description = "Image files"
required = false

[[plugin]]
feature = "bezel"
id = "psx.bezel"
