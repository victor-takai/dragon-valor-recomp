# Dragon Valor (USA) "Hero swap" (experimental). The plugin
# (mods/plugins/dragonvalor_heroswap.c) serves stage files rebuilt with another
# stage's hero by the decomp's tools/heroswap.py from the player's own disc
# (github victor-takai/dragon-valor-decomp, docs/targets/hero-swap.md). The
# package ships no game data: the player selects the folder the tool wrote.
# Off by default; developer channel (local builds only).
format_version = 7
id = "dragonvalor.heroswap"
version = "1.0.0"
name = "Dragon Valor Hero Swap"
author = "Dragon Valor Recomp"
description = "Plays one stage with another hero, from files rebuilt by the decomp's heroswap tool. Experimental, off by default."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-01092"

[[feature]]
id = "heroswap"
name = "Hero swap"
description = "The stage named in the selected folder loads with the hero its files were rebuilt with. Takes effect when that stage loads (a new stage, or CONTINUE after a GAME OVER). Menus and the save still name the stage's own hero. Experimental."
group = "Experimental"
default_enabled = false
# Local builds only (CI releases leave it out): it needs the decomp's tool.
channel = "developer"

[[resource]]
feature = "heroswap"
id = "build"
label = "Rebuilt stage folder"
description = "A folder written by tools/heroswap.py build (heroswap.txt and the file*.bin it names)."
format = "directory"
required = true

[[plugin]]
feature = "heroswap"
id = "dragonvalor.heroswap"
