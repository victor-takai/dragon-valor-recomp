# Dragon Valor (USA) "Play as" (experimental). The plugin
# (mods/plugins/dragonvalor_heroswap.c) loads every action stage with the
# chosen hero: it reads the hero's data from the player's own disc
# (DATA.CDR) at start and rebuilds each stage's files in RAM as they load.
# The package ships no game data. On by default at its neutral choices (each
# stage's own hero, the hero's own weapon: nothing changes), so the in-game
# menu's Play as / Weapon apply at once, with no restart of the game.
format_version = 7
id = "dragonvalor.heroswap"
version = "2.0.0"
name = "Dragon Valor Play As"
author = "Dragon Valor Recomp"
description = "Play every stage as the hero you choose, holding any weapon. Experimental."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-01092"

[[feature]]
id = "play-as"
name = "Play as"
description = "Any hero, or the prologue's Dragon Valor, holding any sword. Every action stage loads with the chosen hero: model, moves, voice, portrait and name, story scenes included; the sword changes only its look. Change it any time in the in-game menu (Hero): the stage restarts with the choice. Anna, Mihael, Anita and six of the swords are read from disc 2 once it has been started with this on; the first start reads the disc for a few seconds. Scenes keep the motions made for the stage's own hero."
group = "Game"
default_enabled = true
channel = "experimental"

[[option]]
feature = "play-as"
id = "hero"
label = "Hero"
description = "The hero of every action stage; Each stage's own keeps the game's choice. Applies at the next stage load."
type = "choice"
default = "stage"

[[option.choice]]
value = "stage"
label = "Each stage's own"

[[option.choice]]
value = "clovis"
label = "Clovis"

[[option.choice]]
value = "arlen"
label = "Arlen"

[[option.choice]]
value = "kodel"
label = "Kodel"

[[option.choice]]
value = "felippe"
label = "Felippe"

[[option.choice]]
value = "phillip"
label = "Phillip"

[[option.choice]]
value = "gerome"
label = "Gerome"

[[option.choice]]
value = "anna"
label = "Anna"

[[option.choice]]
value = "mihael"
label = "Mihael"

[[option.choice]]
value = "anita"
label = "Anita"

[[option.choice]]
value = "dragonvalor"
label = "Dragon Valor (prologue)"

[[option]]
feature = "play-as"
id = "weapon"
label = "Weapon"
description = "The weapon the hero holds: its own, or one of the weapon models the game's heroes hold across both discs (the model and its texture; damage and moves stay the hero's). With Each stage's own above, every stage's hero holds it. The disc-2 weapons (Kadum, Igunis and the last four) are offered once disc 2 has been started with this on. Applies at the next stage load."
type = "choice"
default = "hero"

[[option.choice]]
value = "hero"
label = "The hero's own"

[[option.choice]]
value = "azos"
label = "Azos"

[[option.choice]]
value = "soul"
label = "Soul"

[[option.choice]]
value = "kadum"
label = "Kadum"

[[option.choice]]
value = "igunis"
label = "Igunis"

[[option.choice]]
value = "felippe"
label = "Felippe's first sword"

[[option.choice]]
value = "dark"
label = "Mihael's dark sword"

[[option.choice]]
value = "red"
label = "Anna's red weapon"

[[option.choice]]
value = "purple"
label = "Anita's purple sword"

[[option.choice]]
value = "turquoise"
label = "Anita's turquoise sword"

[[plugin]]
feature = "play-as"
id = "dragonvalor.heroswap"
