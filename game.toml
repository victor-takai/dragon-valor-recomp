# Autofilled by psxrecomp/tools/new_project_layout/probe_disc.py from your legal dump.
# Review before shipping. Runtime quirks / overlay seeds still need hand work.

[game]
name = "DragonValorUS"
id = "SLUS-01092"
players = 1
exe = "disc/SLUS_010.92"
# The player's own dumps, by their Redump file names (no paths): the launcher
# asks for each disc once and remembers the location in settings.toml; the
# multi-disc roster identifies a disc by its file-name stem, so the dumps must
# keep these names ("... (Disc 2).bin" is the same disc as the .cue).
discs = [
    "Dragon Valor (USA) (Disc 1).cue",
    "Dragon Valor (USA) (Disc 2).cue",
]
disc_serials = [
    "SLUS-01092",
    "SLUS-01164",
]
load_address = "0x80010000"
entry_pc = "0x80012EA0"
text_size = "0x00067800"
stack_base = "0x801FFFF0"

# Digests are for data Track 01 (first BINARY FILE / TRACK 01).
[prepare_disc]
out_dir = "disc"
bin_name = "Dragon Valor (USA) (Disc 1) (Track 1).bin"
cue_name = "Dragon Valor (USA) (Disc 1).cue"
boot_exe = "SLUS_010.92"
# One entry per disc: disc 1 (SLUS-01092), disc 2 (SLUS-01164).
known_sizes = [590288496, 657981408]
known_md5 = [
  "2c9782f6009ac474217dc748337078a8",
  "80bf8b4b01e57d63d9e49942f72b4aa7",
]
known_sha1 = [
  "110e7239892f1b7fe0848eea46fa75325cf16111",
  "15e75aee2fdb989f8ba62d9269317949e835f325",
]
known_crc32 = [
  "16aae053",
  "99727f4a",
]

[recompiler]
seeds = "seeds/ghidra_funcs.txt"
out_dir = "generated"
strict = true
# Functions whose generated entry calls the mod function-entry hook
# (psxrecomp/docs/MOD_PACKAGES.md, "Trusted static plugins"). Regenerate
# generated/ after changing this list.
#   0x8006C250  pad-response copy (SIO response buffer -> game pad struct),
#               called once the frame's SIO exchange is complete;
#               dragonvalor.skip-intro writes Start into the response there.
mod_function_entry_funcs = ["0x8006C250"]

[runtime]
window_title = "DragonValorUS Recompiled"
memcard_dir = "saves"
overlay_cache = true

[video]
renderer = "opengl"
aspect_ratio = "4:3"
# Per-title default (the player's settings.toml outranks it): a fresh install
# renders at 1080p instead of the native 240 lines. 3D title, OpenGL.
internal_resolution = "1080p"
# Mip-level emulation for minified 3D world textures (far ground, walls) at
# high internal scale, with 4 anisotropic taps; sprites, HUD and magnified
# textures keep their exact texels. 60 fps held on the test machine; no change
# visible in a static Brize Forest shot, it acts against shimmer in motion.
texture_lod = "mipmap"
anisotropic_filtering = 4
# Shipped filters (player's request, 2026-10-14): the final image is scaled
# with linear filtering (the in-game menu's "Linear filter" row, on), and the
# game's own textures stay nearest, the native look. Bilinear and xBR remain
# one row away in the in-game menu (Graphics > Texture filtering) for the run.
# Both match the framework defaults; written out so the choice is visible.
antialiasing = true
texture_filtering = "nearest"
# PGXP ships on by default through the overriding psx.enhancement.pgxp manifest
# in mods/preloaded (the runtime is the PGXP hook flavour); the mod is the one
# switch, so the [video] geometry keys and the launcher's own row stay out.
pgxp_mod_only = true

[audio]
# Input-to-sound delay; the runtime default is 180 ms. 90 ms showed no pump
# underruns in a muted test, but crackled on the real device at the title
# screen (2026-10-14), so the default stays. Lower it only with the audio
# device playing and `audio_stats` watched.
buffer_ms = 180

[controller]
# "analog" pins a DualShock in analog mode (the game reads the stick; "digital"
# folds it into 8 directions). Only "analog"/"digital" are parsed.
default_mode = "analog"
# Route player 1 to the first SDL game controller; the runtime default is
# "keyboard".
p1_device = "auto"

# Widescreen (docs/DEVELOPMENT.md, *This project's package:
# dragonvalor.enhancement.widescreen*): the framework's native-wide renderer
# keeps the projection and rasterises the extra columns into a wider surface.
# The view is selected by that package's plugin (psx_mod_set_fixed_display_
# aspect), so [video] aspect_ratio stays 4:3 and these keys change nothing
# while the package is off.
[widescreen]
native_wide = true        # the framework default, stated for clarity
# 3D title with no per-sprite tag helper: classify a frame as gameplay when it
# projects vertices through the GTE, so menus, FMV and the title stay 4:3.
gte_game_mode = true

# The game's own screen-X reject, widened by the live margin (identity at 4:3).
# From `psxrecomp-analyze SLUS_010.92 --scan-widescreen`: the stage is 384 px
# wide and two render-funnel functions test X against 0x181 next to a height
# test; auto_screen_x rewrites those compares (3 sites: 0x8001FE1C,
# 0x80040334, 0x8004034C in generated/ shards 05 and 17). Code-generator
# substitution: regenerate generated/ after changing this block.
[widescreen.cull]
auto_screen_x = true
screen_w_imms = ["0x180", "0x181"]
screen_h_imms = ["0xF1", "0x102", "0x103"]

# Online mount gate: digests + track count + optional TOC fingerprint
# (see psxrecomp/docs/NETPLAY.md).
[netplay]
required_disc_fps = [
    "6608a91715cda8396af139845bfe2e6d461dd18b49c519dce529ecfd7110161b",
    "5bb1e329e91768a8dd28d70a8c0623e4299354ed21a617fc34f2ebb6524b6415",
]
require_cue = true
required_tracks = 2
required_disc_fp = "6608a91715cda8396af139845bfe2e6d461dd18b49c519dce529ecfd7110161b"
